apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: odigos-ui
    odigos.io/system-object: "true"
  name: odigos-ui
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odigos-ui
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: ui
      labels:
        app: odigos-ui
    spec:
      {{- if .Values.ui.nodeSelector }}
      # Component-specific nodeSelector (overrides global values.yaml nodeSelector)
      nodeSelector:
      {{- toYaml .Values.ui.nodeSelector | nindent 8 }}
      {{- else if .Values.nodeSelector }}
      # Global nodeSelector from values.yaml
      nodeSelector:
      {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey | quote }}
          whenUnsatisfiable: {{ .whenUnsatisfiable | quote }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: odigos-ui
        {{- end }}
      {{- end }}
      {{- if .Values.ui.priorityClassName }}
      priorityClassName: {{ .Values.ui.priorityClassName }}
      {{- end }}
      containers:
      - name: ui
        {{ $imageTag := .Values.image.tag | default .Chart.AppVersion }}
        image: {{ template "utils.imageName" (dict "Values" .Values "Component" "ui" "Tag" $imageTag) }}
        args:
          - --namespace=$(CURRENT_NS)
          - --address=0.0.0.0
        env:
          - name: CURRENT_NS
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          {{- if .Values.ui.centralBackendURL }}
          - name: CENTRAL_BACKEND_WS_URL
            valueFrom:
              configMapKeyRef:
                name: odigos-configuration
                key: centralBackendURL
          {{- end }}
        ports:
          - containerPort: 3000
            name: ui
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
{{ toYaml .Values.ui.resources | indent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
          - name: ui-db-storage
            mountPath: /data
      {{- if .Values.profiler.enabled }}
      - name: parca
        image: ghcr.io/parca-dev/parca:{{ .Values.profiler.server.version | default "v0.22.0" }}
        args:
          - /parca
          - --config-path=/etc/parca/parca.yaml
          - --path-prefix=/profiling
          - --storage-active-memory={{ .Values.profiler.server.storageActiveMemory | default "1073741824" }}
          - --enable-persistence
          - --storage-path=/data
          - --storage-enable-wal
        ports:
          - containerPort: 7070
            name: parca-http
        volumeMounts:
          - name: parca-config
            mountPath: /etc/parca
          - name: parca-data
            mountPath: /data
        resources:
{{ toYaml .Values.profiler.server.resources | indent 10 }}
      {{- end }}
      securityContext:
      {{- if not .Values.profiler.enabled }}
        runAsNonRoot: true
      {{- end }}
      serviceAccountName: odigos-ui
      terminationGracePeriodSeconds: 10
      volumes:
        - name: ui-db-storage
          emptyDir:
            sizeLimit: 50Mi
        {{- if .Values.profiler.enabled }}
        - name: parca-config
          configMap:
            name: parca-config
        - name: parca-data
          emptyDir:
            sizeLimit: {{ .Values.profiler.server.storageSizeLimit | default "2Gi" }}
        {{- end }}
      {{ include "odigos.renderPullSecrets" . | nindent 6 }}
{{- with .Values.ui }}
  {{- if .tolerations }}
      tolerations: {{ toYaml .tolerations | nindent 8 }}
  {{- end }}
  {{- if .affinity }}
      affinity: {{ toYaml .affinity | nindent 8 }}
  {{- end }}
{{- end }}
