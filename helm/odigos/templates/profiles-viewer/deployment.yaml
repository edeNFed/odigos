{{- if .Values.profiler.enabled }}
{{ $imageTag := .Values.image.tag | default .Chart.AppVersion }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: profiles-viewer
    odigos.io/system-object: "true"
  name: profiles-viewer
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: profiles-viewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profiles-viewer
    spec:
      {{- if .Values.profilesViewer.nodeSelector }}
      nodeSelector:
      {{- toYaml .Values.profilesViewer.nodeSelector | nindent 8 }}
      {{- else if .Values.nodeSelector }}
      nodeSelector:
      {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
      {{- range .Values.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey | quote }}
          whenUnsatisfiable: {{ .whenUnsatisfiable | quote }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: profiles-viewer
      {{- end }}
      {{- end }}
      {{- if .Values.profilesViewer.priorityClassName }}
      priorityClassName: {{ .Values.profilesViewer.priorityClassName }}
      {{- end }}
      containers:
      - name: profiles-viewer
        image: {{ template "utils.imageName" (dict "Values" .Values "Component" "profiles-viewer" "Tag" $imageTag) }}
        args:
          - --http-addr=0.0.0.0:8080
          - --otlp-addr=0.0.0.0:4317
        env:
          - name: GOMEMLIMIT
            value: "700MiB"
          - name: OTEL_SERVICE_NAME
            value: profiles-viewer
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
          - name: otlp
            containerPort: 4317
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
{{ toYaml .Values.profilesViewer.resources | indent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
      serviceAccountName: profiles-viewer
      terminationGracePeriodSeconds: 30
      {{ include "odigos.renderPullSecrets" . | nindent 6 }}
      {{- with .Values.profilesViewer }}
      {{- if .tolerations }}
      tolerations: {{ toYaml .tolerations | nindent 8 }}
      {{- end }}
      {{- if .affinity }}
      affinity: {{ toYaml .affinity | nindent 8 }}
      {{- end }}
      {{- end }}
{{- end }}
