{{- if .Values.profiler.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: profiles-viewer
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: profiles-viewer
    odigos.io/system-object: "true"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: otlp
      port: 4317
      targetPort: 4317
      protocol: TCP
  selector:
    app.kubernetes.io/name: profiles-viewer
{{- end }}
